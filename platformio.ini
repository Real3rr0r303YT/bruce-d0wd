; ============================================================================
;  Bruce-D0WD  -  PlatformIO project configuration
;  Target : ESP32-D0WD (classic dual-core ESP32) with SSD1306 OLED
; ============================================================================
;
;  This is a hardware bring-up / scaffold firmware. It initializes the OLED
;  display and the optional wireless front-ends (NRF24, CC1101, IR, RC522)
;  and exposes a simple menu framework. It is intended for education,
;  hobbyist RF experimentation and AUTHORIZED testing only.
;
; ----------------------------------------------------------------------------

[platformio]
default_envs = esp32-d0wd

[env:esp32-d0wd]
platform  = espressif32
board     = esp32dev          ; ESP32-D0WD is the chip on the generic esp32dev board
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM=0

; ---------------------------------------------------------------------------
;  Libraries
;    - Display  : Adafruit SSD1306 + GFX
;    - NRF24    : RF24
;    - CC1101   : SmartRC-CC1101-Driver-Lib
;    - IR       : IRremoteESP8266
;    - RFID     : MFRC522 (RC522)
; ---------------------------------------------------------------------------
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.5
    nrf24/RF24 @ ^1.4.8
    SPI
    Wire
    LennartHennigs/SmartRC-CC1101-Driver-Lib @ ^2.5.7
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    miguelbalboa/MFRC522 @ ^1.4.11
