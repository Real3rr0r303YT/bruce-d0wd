; ESP Multitool – ESP32-D0WD + SSD1306 128x64
[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_flash = 40000000L
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Os
    -DCORE_DEBUG_LEVEL=0
    ; Flash-Schreiben im Webserver-Task darf den Watchdog nicht ausloesen
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=12288
    ; NimBLE: nur Scannen (Observer), kein Advertising/Verbinden
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    ; IRremoteESP8266: nur gaengige Protokolle (Flash sparen), RAW geht immer
    -D_IR_ENABLE_DEFAULT_=false
    -DDECODE_HASH=true
    -DSEND_RAW=true
    -DDECODE_NEC=true
    -DSEND_NEC=true
    -DDECODE_SAMSUNG=true
    -DSEND_SAMSUNG=true
    -DDECODE_SAMSUNG36=true
    -DSEND_SAMSUNG36=true
    -DDECODE_SONY=true
    -DSEND_SONY=true
    -DDECODE_RC5=true
    -DSEND_RC5=true
    -DDECODE_RC6=true
    -DSEND_RC6=true
    -DDECODE_LG=true
    -DSEND_LG=true
    -DDECODE_PANASONIC=true
    -DSEND_PANASONIC=true
    -DDECODE_JVC=true
    -DSEND_JVC=true
    -DDECODE_SHARP=true
    -DSEND_SHARP=true
lib_deps =
    olikraus/U8g2 @ ^2.35.30
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    nrf24/RF24 @ ^1.4.11
    h2zero/NimBLE-Arduino @ ^1.4.3
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ricmoo/QRCode @ ^0.0.1
extra_scripts = post:merge_bin.py
